  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* ── 로딩 스크린 ── */
    #loader {
      position: fixed; inset: 0;
      background: #1a5c38;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; }

    .shuttle-wrap {
      position: relative; width: 100px; height: 100px;
    }
    .shuttle-svg {
      width: 100px; height: 100px;
      animation: floatShuttle 1.8s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
    }
    @keyframes floatShuttle {
      0%,100% { transform: translateY(0) rotate(-15deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    .trail {
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 10px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.25) 0%, transparent 70%);
      animation: trailPulse 1.8s ease-in-out infinite;
    }
    @keyframes trailPulse {
      0%,100% { opacity: 0.8; transform: translateX(-50%) scaleX(1); }
      50%      { opacity: 0.2; transform: translateX(-50%) scaleX(0.5); }
    }

    .loader-text {
      color: #fff;
      font-size: 28px; font-weight: 700;
      letter-spacing: 0.08em;
      animation: fadeInText 0.8s ease forwards;
      opacity: 0;
    }
    .loader-sub {
      color: rgba(255,255,255,0.6);
      font-size: 13px; letter-spacing: 0.12em;
      animation: fadeInText 0.8s 0.3s ease forwards;
      opacity: 0;
    }
    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loader-dots {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .loader-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: dotBounce 1.2s infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
      40%          { transform: scale(1.2); opacity: 1; }
    }

    /* ── 메인 콘텐츠 ── */
    #app { opacity: 0; transition: opacity 0.5s ease; }
    #app.show { opacity: 1; }

    .container { max-width: 820px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 12px; }
    .header-icon {
      width: 44px; height: 44px; background: #1a5c38;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
    .header p { font-size: 13px; color: #666; }

    .search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1.25rem; }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap input {
      width: 100%; padding: 9px 12px 9px 36px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; background: #fff; outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: #1a5c38; }
    .search-wrap .ti {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: #999; pointer-events: none;
    }
    .reset-btn {
      font-size: 13px; color: #666; border: none; background: none;
      cursor: pointer; padding: 8px 6px; display: flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .reset-btn:hover { color: #1a1a1a; }

    .filter-panel {
      background: #fff; border-radius: 12px; border: 1px solid #e8e8e8;
      padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 1.25rem;
    }
    .filter-group { display: flex; flex-direction: column; gap: 7px; }
    .filter-label { font-size: 11px; color: #999; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .divider { height: 1px; background: #f0f0f0; }

    .badge-btn {
      font-size: 13px; padding: 5px 15px; border-radius: 20px;
      border: 1px solid #ddd; cursor: pointer;
      background: #fff; color: #666;
      transition: all 0.12s; font-weight: 400;
    }
    .badge-btn:hover { border-color: #aaa; color: #1a1a1a; }

    .active-all    { background: #1a5c38 !important; color: #fff !important; border-color: #1a5c38 !important; font-weight: 500 !important; }
    .active-gender { background: #185fa5 !important; color: #e6f1fb !important; border-color: #185fa5 !important; font-weight: 500 !important; }
    .active-age    { background: #3b6d11 !important; color: #eaf3de !important; border-color: #3b6d11 !important; font-weight: 500 !important; }
    .active-grade-A{ background: #3b6d11 !important; color: #eaf3de !important; border-color: #3b6d11 !important; font-weight: 500 !important; }
    .active-grade-B{ background: #185fa5 !important; color: #e6f1fb !important; border-color: #185fa5 !important; font-weight: 500 !important; }

    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
    .stat-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 14px; }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-val { font-size: 22px; font-weight: 600; }

    .tbl-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {

</head>

  el.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='badge-btn'+(sel.size===0?' active-all':'');
  allBtn.textContent='전체';
  allBtn.onclick=()=>{ sel.clear(); initFilters(); render(); };
  el.appendChild(allBtn);
  vals.forEach(v=>{
    const b=document.createElement('button');
    b.className='badge-btn'+(sel.has(v)?' '+activeClass(v):'');
    b.textContent=label(v);
    b.onclick=()=>{ sel.has(v)?sel.delete(v):sel.add(v); initFilters(); render(); };
    el.appendChild(b);
  });
}

function getFiltered(){
  const q=document.getElementById('nameSearch').value.trim();
  return members.filter(m=>{
    if(q&&!m.name.includes(q)) return false;
    if(selGender.size&&!selGender.has(m.gender)) return false;
    if(selAge.size&&!selAge.has(m.age)) return false;
    if(selGrade.size&&!selGrade.has(m.grade)) return false;
    return true;
  });
}

function sortBy(key){
  if(sortKey===key) sortAsc=!sortAsc;
  else { sortKey=key; sortAsc=true; }
  render();
}

function render(){
  let data=getFiltered();
  ['no','name','gender','age','grade'].forEach(k=>{
    const el=document.getElementById('sort-'+k);
    if(el) el.textContent=sortKey===k?(sortAsc?'↑':'↓'):'';
  });
  data.sort((a,b)=>{
    let va=a[sortKey],vb=b[sortKey];
    if(typeof va==='string') return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
    return sortAsc?va-vb:vb-va;
  });
  const tbody=document.getElementById('tableBody');
  const empty=document.getElementById('emptyMsg');
  document.getElementById('statTotal').textContent=data.length;
  document.getElementById('statM').textContent=data.filter(m=>m.gender==='남').length;
  document.getElementById('statF').textContent=data.filter(m=>m.gender==='여').length;
  if(!data.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML=data.map(m=>`<tr>
    <td style="color:#999">${m.no}</td>
    <td style="font-weight:500">${m.name}</td>
    <td>${m.gender}성</td>
    <td>${m.age}대</td>
    <td><span class="grade-pill g-${m.grade}">${m.grade}급</span></td>
  </tr>`).join('');
}

function resetAll(){
  selGender.clear(); selAge.clear(); selGrade.clear();
  document.getElementById('nameSearch').value='';
  sortKey='no'; sortAsc=true;
  initFilters(); render();
}

// 로딩 후 앱 표시
window.addEventListener('load', ()=>{
  initFilters();
  render();
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    document.getElementById('app').classList.add('show');
  }, 2200);
});
</script>
</body>
</html>
